<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tachyphos.net</title>
    
    <!-- External Dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <link rel="stylesheet" href="style.css"></link>
    <script src="script.js"></script>

</head>
<body>
    <header>
        <div class="header-main-row">
            <div class="header-left">
                <div class="site-logo" onclick="app.loadPage('main')">tachyphos.net</div>
            </div>
            <div class="header-right">
                <div class="search-bar">
                    <input type="text" id="site-search" placeholder="Search pages..." autocomplete="off">
                    <div id="search-results" class="search-results-popup"></div>
                </div>
            </div>
        </div>

        <nav class="nav-bar-strip">
            <ul id="top-nav-items" class="horizontal-nav-list"> </ul>
        </nav>
    </header>

    <div class="container">
        <nav>
            <div id="status-panel" class="nav-section">
                <h4>Have feedback?</h4>
                <div class="status-card">
                    <div class="status-row"><span>Bug/RFE:</span> <span ><a target="_blank" rel="noopener noreferrer" href="https://github.com/jmparikh/transceivers.net/issues" class="tag-green">File an Issue</a></span></div>
                    <div class="status-row"><span>Feedback:</span> <strong>rx@tachyphos.net</strong></div>
                    <div class="status-row"><span></span>(rx-only)</div>
                </div>
            </div>
            <div id="toc-panel" class="nav-section">
                <h4>On This Page</h4>
                <ul id="auto-nav" class="nav-list"></ul>
            </div>
            <div class="nav-section">
                <h4>Sub Modules</h4>
                <ul id="sub-library-links" class="nav-list"></ul>
            </div>
        </nav>
        <!-- Uncomment this to enable the ancient home button -->
        <!-- <span id="global-controls"></span> -->
        <main id="main-content"></main>
    </div>

    <footer class="site-footer">
        <div class="footer-content">
            <span class="footer-credits">© 2026 tachyphos.net</span>
            <span class="footer-text">Light Speed!</span>
            <span class="footer-credits">Created by Jainam Parikh and w/some AI help :)</span>
        </div>
    </footer>

</body>
</html>
